# This is a Declarative Automation Bundle definition for devops_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: devops_bundle
  uuid: ccd20c42-1891-436c-a82b-754ed6559bd8

include:
  - resources/**/*.yml

sync:
  paths:
    - src
# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-317f79cb-0901.cloud.databricks.com
    variables:
      catalog: assetbundles
      schema: sampleschema
  prod:
    mode: production
    workspace:
      host: https://dbc-317f79cb-0901.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/siddhe4133@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/siddhe4133@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: assetbundles_prod
      schema: prod
    permissions:
      - user_name: siddhe4133@gmail.com
        level: CAN_MANAGE
