# A sample job for devops_bundle.

resources:
  jobs:
    sample_jobs:
      name: sample_jobs

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../../src/sample_notebook.py
        # - task_key: refresh_pipeline
        #   depends_on:
        #     - task_key: notebook_task
        #   pipeline_task:
        #     pipeline_id: ${resources.pipelines.devops_bundle_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"

    new_job:
